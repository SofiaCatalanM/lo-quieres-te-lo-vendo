<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo quieres, te lo vendo</title>
    <link rel="stylesheet" href="assets/style.css">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <h1>Lo quieres, te lo vendo</h1>

    <nav class="blue">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo">Lo quieres, te lo vendo</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#productos">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 30px;">
        <div class="row">
            <form class="col s12 m8 l6 offset-m2 offset-l3" action="#" method="POST">
                <h4 class="center-align">Formulario de Contacto</h4>
                
                <div class="row">
                    <div class="input-field col s12">
                        <input id="nombre" type="text" class="validate" required>
                        <label for="nombre">Nombre</label>
                    </div>
                </div>
                
                <div class="row">
                    <div class="input-field col s12">
                        <input id="email" type="email" class="validate" required>
                        <label for="email">Email</label>
                    </div>
                </div>
                
                <div class="row">
                    <div class="input-field col s12">
                        <textarea id="mensaje" class="materialize-textarea" required></textarea>
                        <label for="mensaje">Mensaje</label>
                    </div>
                </div>
                
                <div class="row center-align">
                    <button class="btn waves-effect waves-light blue" type="submit" name="action">
                        Enviar
                        <i class="material-icons right">send</i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>Equipo Sofia Catalan - 2026</p>
    </footer>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // Inicializa los componentes de Materialize (como las etiquetas flotantes del formulario)
        document.addEventListener('DOMContentLoaded', function() {
            M.updateTextFields();
        });
    </script>
</body>
</html>
